<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>坂柳 有栖 — トーク</title>
    <link rel="icon" href="assets/arisu.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="phone">
      <header class="bar">
        <img class="avatar avatar--head" src="assets/arisu.svg" alt="坂柳 有栖のアイコン" data-avatar />
        <div class="who">
          <h1>坂柳 有栖</h1>
          <p id="status" class="status" data-state="online">オンライン</p>
        </div>
        <div class="controls">
          <button id="speed" type="button" aria-label="再生速度">1×</button>
          <button id="pause" type="button" aria-label="一時停止" aria-pressed="false">
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" /></svg>
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          </button>
          <button id="skip" type="button" aria-label="最後まで表示">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l9-7zM16 5h3v14h-3z" /></svg>
          </button>
        </div>
      </header>

      <section id="log" class="log" aria-live="polite" aria-label="メッセージ"></section>

      <footer class="composer">
        <div id="draft" class="draft" data-placeholder="メッセージを入力" aria-label="入力中のメッセージ"></div>
        <span class="send" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l11 2-11 2z" /></svg>
        </span>
      </footer>

      <form id="intro" class="intro" autocomplete="off">
        <img class="avatar avatar--xl" src="assets/arisu.svg" alt="坂柳 有栖のアイコン" data-avatar />
        <h2>坂柳 有栖</h2>
        <p>彼女が学校を去ってから、はじめて繋がった夜。</p>
        <label for="name">あなたの名前(空欄でもOK)</label>
        <input id="name" name="name" type="text" maxlength="12" placeholder="例:ユウ" />
        <button type="submit">トークを開く</button>
      </form>
    </main>

    <script src="conversation.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
